<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Two mobile weather screens showing a large forecast orb and a weekly outlook">
  <defs>
    <linearGradient id="orbitBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f6367"/>
      <stop offset=".55" stop-color="#0a4f55"/>
      <stop offset="1" stop-color="#073a40"/>
    </linearGradient>
    <linearGradient id="orbitScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#117074"/>
      <stop offset="1" stop-color="#083c42"/>
    </linearGradient>
    <radialGradient id="orbitSun" cx=".38" cy=".32" r=".78">
      <stop offset="0" stop-color="#f3fffc"/>
      <stop offset=".45" stop-color="#9df2e1"/>
      <stop offset="1" stop-color="#18b59a"/>
    </radialGradient>
    <linearGradient id="orbitPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3c42"/>
      <stop offset="1" stop-color="#062c31"/>
    </linearGradient>
    <filter id="orbitShadow" x="-40%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#021c1f" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#orbitBg)"/>
  <g fill="#ffffff" opacity=".28">
    <circle cx="110" cy="86" r="1.7"/>
    <circle cx="150" cy="150" r="1.2"/>
    <circle cx="84" cy="250" r="1.5"/>
    <circle cx="706" cy="112" r="1.6"/>
    <circle cx="742" cy="330" r="1.3"/>
    <circle cx="644" cy="62" r="1.1"/>
    <circle cx="690" cy="430" r="1.5"/>
    <circle cx="238" cy="56" r="1.1"/>
  </g>
  <circle cx="290" cy="225" r="150" fill="none" stroke="#8df0dd" stroke-opacity=".1"/>
  <circle cx="290" cy="225" r="196" fill="none" stroke="#8df0dd" stroke-opacity=".06"/>
  <circle cx="654" cy="392" r="120" fill="#18b59a" fill-opacity=".08"/>

  <g filter="url(#orbitShadow)">
    <rect x="180" y="62" width="210" height="390" rx="34" fill="url(#orbitPhone)" stroke="#ffffff" stroke-opacity=".17"/>
    <rect x="191" y="73" width="188" height="368" rx="25" fill="url(#orbitScreen)"/>
    <rect x="262" y="82" width="46" height="9" rx="4.5" fill="#062c31"/>
  </g>

  <g font-family="Manrope, Segoe UI, sans-serif">
    <text x="204" y="103" fill="#ffffff" font-size="9" font-weight="700" opacity=".8">9:41</text>
    <g fill="#ffffff" opacity=".65">
      <rect x="344" y="97" width="3" height="5" rx="1"/>
      <rect x="349" y="95" width="3" height="7" rx="1"/>
      <rect x="354" y="93" width="3" height="9" rx="1"/>
      <rect x="362" y="95" width="10" height="7" rx="2"/>
    </g>
    <text x="204" y="141" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="-.2">Copenhagen</text>
    <text x="204" y="155" fill="#9fd8d1" font-size="8.5" font-weight="600">Tuesday, 21 October · Updated now</text>
  </g>

  <circle cx="290" cy="228" r="82" fill="none" stroke="#8df0dd" stroke-opacity=".22" stroke-dasharray="3 7"/>
  <circle cx="290" cy="228" r="63" fill="#18b59a" fill-opacity=".1"/>
  <circle cx="290" cy="228" r="49" fill="url(#orbitSun)"/>
  <g fill="#0a5f5a" opacity=".22">
    <ellipse cx="303" cy="216" rx="24" ry="10"/>
    <ellipse cx="278" cy="238" rx="18" ry="7"/>
  </g>

  <text x="290" y="321" text-anchor="middle" fill="#ffffff" font-family="Manrope, Segoe UI, sans-serif" font-size="47" font-weight="300" letter-spacing="-2">24°</text>
  <text x="290" y="339" text-anchor="middle" fill="#c9ece6" font-family="Manrope, Segoe UI, sans-serif" font-size="9.5" font-weight="600">Clear skies · Feels like 23°</text>

  <g>
    <rect x="204" y="355" width="162" height="58" rx="12" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".1"/>
    <g font-family="Manrope, Segoe UI, sans-serif" text-anchor="middle" fill="#ffffff">
      <text x="231" y="372" font-size="7" fill="#a9dcd5" font-weight="700">NOW</text>
      <circle cx="231" cy="387" r="6" fill="#8df0dd"/>
      <text x="231" y="405" font-size="8.5" font-weight="700">24°</text>
      <text x="270" y="372" font-size="7" fill="#a9dcd5" font-weight="700">14:00</text>
      <circle cx="270" cy="387" r="6" fill="#eaf7f4" fill-opacity=".75"/>
      <text x="270" y="405" font-size="8.5" font-weight="700">25°</text>
      <text x="309" y="372" font-size="7" fill="#a9dcd5" font-weight="700">16:00</text>
      <circle cx="309" cy="387" r="6" fill="#eaf7f4" fill-opacity=".55"/>
      <text x="309" y="405" font-size="8.5" font-weight="700">23°</text>
      <text x="348" y="372" font-size="7" fill="#a9dcd5" font-weight="700">18:00</text>
      <circle cx="348" cy="387" r="6" fill="#eaf7f4" fill-opacity=".35"/>
      <text x="348" y="405" font-size="8.5" font-weight="700">20°</text>
    </g>
  </g>

  <g fill="#ffffff" opacity=".5">
    <circle cx="256" cy="431" r="2.5"/>
    <circle cx="290" cy="431" r="2.5" fill="#8df0dd" opacity="1"/>
    <circle cx="324" cy="431" r="2.5"/>
  </g>

  <g transform="rotate(6 540 300)" filter="url(#orbitShadow)">
    <rect x="430" y="112" width="210" height="368" rx="32" fill="url(#orbitPhone)" stroke="#ffffff" stroke-opacity=".15"/>
    <rect x="441" y="123" width="188" height="346" rx="23" fill="url(#orbitScreen)"/>
  </g>

  <g transform="rotate(6 540 300)" font-family="Manrope, Segoe UI, sans-serif">
    <text x="463" y="160" fill="#ffffff" font-size="12" font-weight="700">This week</text>
    <text x="463" y="174" fill="#9fd8d1" font-size="8" font-weight="600">Mild days, cool evenings</text>

    <g font-size="9" font-weight="600">
      <text x="463" y="200" fill="#c9ece6">Wed</text>
      <circle cx="500" cy="197" r="5" fill="#8df0dd" fill-opacity=".9"/>
      <rect x="518" y="194" width="70" height="5" rx="2.5" fill="#ffffff" fill-opacity=".15"/>
      <rect x="518" y="194" width="46" height="5" rx="2.5" fill="#8df0dd"/>
      <text x="607" y="200" fill="#ffffff">24°</text>

      <text x="463" y="228" fill="#c9ece6">Thu</text>
      <circle cx="500" cy="225" r="5" fill="#c9ece6" fill-opacity=".65"/>
      <rect x="518" y="222" width="70" height="5" rx="2.5" fill="#ffffff" fill-opacity=".15"/>
      <rect x="518" y="222" width="38" height="5" rx="2.5" fill="#8df0dd"/>
      <text x="607" y="228" fill="#ffffff">21°</text>

      <text x="463" y="256" fill="#c9ece6">Fri</text>
      <circle cx="500" cy="253" r="5" fill="#c9ece6" fill-opacity=".5"/>
      <rect x="518" y="250" width="70" height="5" rx="2.5" fill="#ffffff" fill-opacity=".15"/>
      <rect x="518" y="250" width="30" height="5" rx="2.5" fill="#8df0dd"/>
      <text x="607" y="256" fill="#ffffff">18°</text>

      <text x="463" y="284" fill="#c9ece6">Sat</text>
      <circle cx="500" cy="281" r="5" fill="#8df0dd" fill-opacity=".95"/>
      <rect x="518" y="278" width="70" height="5" rx="2.5" fill="#ffffff" fill-opacity=".15"/>
      <rect x="518" y="278" width="53" height="5" rx="2.5" fill="#8df0dd"/>
      <text x="607" y="284" fill="#ffffff">25°</text>

      <text x="463" y="312" fill="#c9ece6">Sun</text>
      <circle cx="500" cy="309" r="5" fill="#8df0dd" fill-opacity=".8"/>
      <rect x="518" y="306" width="70" height="5" rx="2.5" fill="#ffffff" fill-opacity=".15"/>
      <rect x="518" y="306" width="49" height="5" rx="2.5" fill="#8df0dd"/>
      <text x="607" y="312" fill="#ffffff">24°</text>
    </g>

    <rect x="463" y="338" width="144" height="42" rx="10" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="475" y="354" fill="#a9dcd5" font-size="7" font-weight="700" letter-spacing=".8">AIR QUALITY</text>
    <text x="475" y="369" fill="#8df0dd" font-size="11" font-weight="700">12 · Good</text>
    <circle cx="592" cy="359" r="10" fill="#8df0dd" fill-opacity=".15"/>
    <path d="M588 359h8M593 355l4 4-4 4" fill="none" stroke="#8df0dd" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="463" y="400" width="144" height="38" rx="19" fill="#18b59a"/>
    <text x="535" y="423" text-anchor="middle" fill="#05343a" font-size="9.5" font-weight="800">View forecast</text>
  </g>

  <g opacity=".9">
    <rect x="634" y="48" width="118" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="654" cy="65" r="4" fill="#8df0dd"/>
    <text x="666" y="69" fill="#d8f1ec" font-family="Manrope, Segoe UI, sans-serif" font-size="8.5" font-weight="700">Live forecast</text>
  </g>
</svg>
