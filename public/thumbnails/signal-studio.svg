<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Dark audio studio page with a teal waveform, player and episode list">
  <defs>
    <linearGradient id="signalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a4349"/>
      <stop offset="1" stop-color="#042c31"/>
    </linearGradient>
    <linearGradient id="signalWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8df0dd"/>
      <stop offset=".6" stop-color="#18b59a"/>
      <stop offset="1" stop-color="#0d8a77"/>
    </linearGradient>
    <linearGradient id="signalCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d5258"/>
      <stop offset="1" stop-color="#083c42"/>
    </linearGradient>
    <filter id="signalShadow" x="-30%" y="-30%" width="170%" height="190%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#001a1d" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#signalBg)"/>
  <circle cx="735" cy="70" r="130" fill="none" stroke="#8df0dd" stroke-opacity=".07"/>
  <circle cx="735" cy="70" r="190" fill="none" stroke="#8df0dd" stroke-opacity=".04"/>
  <circle cx="90" cy="450" r="150" fill="#18b59a" fill-opacity=".06"/>

  <text x="56" y="58" fill="#ffffff" font-family="Manrope, Segoe UI, sans-serif" font-size="15" font-weight="800" letter-spacing="4.5">SIGNAL</text>
  <circle cx="151" cy="52" r="3.5" fill="#18b59a"/>
  <text x="162" y="58" fill="#8fb8b2" font-family="Manrope, Segoe UI, sans-serif" font-size="7" font-weight="700" letter-spacing="1.8">STUDIO</text>

  <g fill="#b8d6d1" font-family="Manrope, Segoe UI, sans-serif" font-size="8.5" font-weight="600">
    <text x="580" y="57">Episodes</text>
    <text x="640" y="57">About</text>
    <text x="690" y="57">Subscribe</text>
  </g>
  <line x1="56" y1="78" x2="744" y2="78" stroke="#ffffff" stroke-opacity=".09"/>

  <g filter="url(#signalShadow)">
    <rect x="56" y="100" width="430" height="342" rx="18" fill="url(#signalCard)" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="56" y="100" width="430" height="342" rx="18" fill="none" stroke="#18b59a" stroke-opacity=".16"/>
  </g>

  <text x="82" y="132" fill="#8df0dd" font-family="Manrope, Segoe UI, sans-serif" font-size="7.5" font-weight="800" letter-spacing="2">EP. 12 · STUDIO NOTES</text>
  <text x="82" y="175" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="33">Designing for</text>
  <text x="82" y="209" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-style="italic">calm.</text>
  <text x="82" y="232" fill="#a9cac4" font-family="Manrope, Segoe UI, sans-serif" font-size="8.5" font-weight="600">A conversation about quiet interfaces,</text>
  <text x="82" y="245" fill="#a9cac4" font-family="Manrope, Segoe UI, sans-serif" font-size="8.5" font-weight="600">slow tools and the cost of noise.</text>

