    <linearGradient id="pulseArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18b59a" stop-opacity=".32"/>
      <stop offset="1" stop-color="#18b59a" stop-opacity="0"/>
    </linearGradient>
    <filter id="pulseShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#032a2e" flood-opacity=".5"/>
    </filter>
    <clipPath id="pulseChartClip">
      <rect x="192" y="258" width="538" height="170" rx="12"/>
    </clipPath>
  </defs>

