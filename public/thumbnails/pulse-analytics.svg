<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Dashboard illustration with metric cards and a rising trend chart">
  <defs>
    <linearGradient id="pulseBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d545b"/>
      <stop offset="1" stop-color="#073a40"/>
    </linearGradient>
    <linearGradient id="pulseLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8df0dd"/>
      <stop offset="1" stop-color="#18b59a"/>
