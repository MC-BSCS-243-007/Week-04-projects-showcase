<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Collaborative notes board with columns of cards and a live cursor">
  <defs>
    <linearGradient id="mosaicBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf7f4"/>
      <stop offset="1" stop-color="#dcf0ea"/>
    </linearGradient>
    <filter id="mosaicShadow" x="-30%" y="-30%" width="170%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a4a47" flood-opacity=".14"/>
    </filter>
    <filter id="mosaicSoft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0a4a47" flood-opacity=".12"/>
    </filter>
    <pattern id="mosaicGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#073a40" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#mosaicBg)"/>
  <rect width="800" height="500" fill="url(#mosaicGrid)"/>
  <circle cx="720" cy="440" r="150" fill="#18b59a" fill-opacity=".07"/>

  <g filter="url(#mosaicShadow)">
    <rect x="44" y="36" width="712" height="54" rx="15" fill="#ffffff"/>
    <rect x="58" y="49" width="28" height="28" rx="8" fill="#073a40"/>
    <path d="M65 70V56M72 70V56M79 70V56M65 60h14M65 66h14" stroke="#8df0dd" stroke-width="1.5" stroke-linecap="round"/>
    <text x="96" y="68" fill="#073a40" font-family="Manrope, Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="-.2">Mosaic</text>
    <g font-family="Manrope, Segoe UI, sans-serif" font-size="8.5" font-weight="700">
      <rect x="196" y="49" width="58" height="28" rx="8" fill="#eaf7f4"/>
      <text x="225" y="67" text-anchor="middle" fill="#073a40">Board</text>
      <text x="281" y="67" fill="#7b9692">Notes</text>
      <text x="333" y="67" fill="#7b9692">Calendar</text>
    </g>
    <g>
      <circle cx="620" cy="63" r="12" fill="#18b59a"/>
      <text x="620" y="66.5" text-anchor="middle" fill="#073a40" font-family="Manrope, Segoe UI, sans-serif" font-size="7" font-weight="800">SR</text>
      <circle cx="640" cy="63" r="12" fill="#0b4c53"/>
      <text x="640" y="66.5" text-anchor="middle" fill="#ffffff" font-family="Manrope, Segoe UI, sans-serif" font-size="7" font-weight="800">DM</text>
      <circle cx="660" cy="63" r="12" fill="#d7e9e4"/>
      <text x="660" y="66.5" text-anchor="middle" fill="#073a40" font-family="Manrope, Segoe UI, sans-serif" font-size="7" font-weight="800">EP</text>
    </g>
    <rect x="682" y="48" width="58" height="30" rx="15" fill="#073a40"/>
    <text x="711" y="67" text-anchor="middle" fill="#ffffff" font-family="Manrope, Segoe UI, sans-serif" font-size="8" font-weight="700">Share</text>
  </g>

  <g font-family="Manrope, Segoe UI, sans-serif">
    <text x="44" y="122" fill="#073a40" font-size="10" font-weight="800" letter-spacing=".2">Backlog</text>
    <text x="44" y="140" fill="#7b9692" font-size="7.5" font-weight="600">Ideas waiting for a home</text>
    <text x="292" y="122" fill="#073a40" font-size="10" font-weight="800" letter-spacing=".2">In progress</text>
    <text x="292" y="140" fill="#7b9692" font-size="7.5" font-weight="600">Sofia is editing</text>
    <text x="540" y="122" fill="#073a40" font-size="10" font-weight="800" letter-spacing=".2">Ideas</text>
    <text x="540" y="140" fill="#7b9692" font-size="7.5" font-weight="600">Loose thoughts welcome</text>
    <rect x="234" y="112" width="18" height="15" rx="7.5" fill="#ffffff"/>
    <text x="243" y="122.5" text-anchor="middle" fill="#5e7879" font-size="7" font-weight="800">2</text>
    <rect x="486" y="112" width="18" height="15" rx="7.5" fill="#ffffff"/>
    <text x="495" y="122.5" text-anchor="middle" fill="#5e7879" font-size="7" font-weight="800">2</text>
  </g>

  <g filter="url(#mosaicSoft)">
    <rect x="44" y="156" width="216" height="92" rx="10" fill="#ffffff"/>
    <rect x="56" y="168" width="52" height="14" rx="7" fill="#eaf7f4"/>
    <text x="82" y="178" text-anchor="middle" fill="#0a7969" font-family="Manrope, Segoe UI, sans-serif" font-size="6" font-weight="800" letter-spacing=".5">RESEARCH</text>
    <text x="56" y="202" fill="#073a40" font-family="Manrope, Segoe UI, sans-serif" font-size="10.5" font-weight="700">Interview five teams</text>
    <text x="56" y="215" fill="#073a40" font-family="Manrope, Segoe UI, sans-serif" font-size="10.5" font-weight="700">about weekly rituals</text>
    <circle cx="62" cy="234" r="7" fill="#d7e9e4"/>
    <text x="76" y="237" fill="#7b9692" font-family="Manrope, Segoe UI, sans-serif" font-size="6.5" font-weight="600">Due Fri · Maya</text>
  </g>

  <g filter="url(#mosaicSoft)">
    <rect x="44" y="260" width="216" height="66" rx="10" fill="#ffffff"/>
    <text x="56" y="282" fill="#073a40" font-family="Manrope, Segoe UI, sans-serif" font-size="10.5" font-weight="700">Sketch the empty state</text>
    <text x="56" y="296" fill="#7b9692" font-family="Manrope, Segoe UI, sans-serif" font-size="7">A little warmth, not an error.</text>
    <rect x="56" y="306" width="38" height="12" rx="6" fill="#f2ede4"/>
    <text x="75" y="314.5" text-anchor="middle" fill="#7c7568" font-family="Manrope, Segoe UI, sans-serif" font-size="5.5" font-weight="700">COPY</text>
    <circle cx="242" cy="214" r="7" fill="#18b59a"/>
    <path d="M238 214l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="44" y="338" width="216" height="54" rx="10" fill="#ffffff" fill-opacity=".35" stroke="#0a7969" stroke-opacity=".28" stroke-dasharray="4 5"/>
  <g stroke="#0a7969" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round">
    <path d="M146 361v8M142 365h8"/>
  </g>
  <text x="154" y="368" fill="#0a7969" font-family="Manrope, Segoe UI, sans-serif" font-size="7" font-weight="700">Add a card</text>

  <g filter="url(#mosaicShadow)">
    <rect x="292" y="156" width="216" height="126" rx="10" fill="#ffffff"/>
    <rect x="292" y="156" width="4" height="126" rx="2" fill="#18b59a"/>
    <text x="308" y="180" fill="#073a40" font-family="Manrope, Segoe UI, sans-serif" font-size="11" font-weight="700">Draft the onboarding flow</text>
    <text x="308" y="194" fill="#7b9692" font-family="Manrope, Segoe UI, sans-serif" font-size="7">Three steps, one clear promise.</text>
    <rect x="308" y="206" width="60" height="6" rx="3" fill="#eaf7f4"/>
    <rect x="308" y="206" width="41" height="6" rx="3" fill="#18b59a"/>
    <text x="374" y="212" fill="#5e7879" font-family="Manrope, Segoe UI, sans-serif" font-size="6" font-weight="700">68%</text>
    <g font-family="Manrope, Segoe UI, sans-serif" font-size="6" font-weight="600">
      <rect x="308" y="224" width="42" height="13" rx="6.5" fill="#eaf7f4"/>
      <text x="329" y="233" text-anchor="middle" fill="#0a7969">Empty state</text>
      <rect x="356" y="224" width="46" height="13" rx="6.5" fill="#eaf7f4"/>
      <text x="379" y="233" text-anchor="middle" fill="#0a7969">Motion</text>
    </g>
    <circle cx="316" cy="260" r="8" fill="#0b4c53"/>
    <text x="316" y="263" text-anchor="middle" fill="#ffffff" font-family="Manrope, Segoe UI, sans-serif" font-size="5.5" font-weight="800">SR</text>
    <text x="330" y="263" fill="#7b9692" font-family="Manrope, Segoe UI, sans-serif" font-size="6.5" font-weight="600">Edited just now</text>
    <rect x="434" y="248" width="58" height="26" rx="8" fill="#073a40"/>
    <text x="463" y="264" text-anchor="middle" fill="#ffffff" font-family="Manrope, Segoe UI, sans-serif" font-size="6.5" font-weight="700">Open note</text>
  </g>

  <g filter="url(#mosaicSoft)">
    <rect x="292" y="294" width="216" height="72" rx="10" fill="#ffffff"/>
    <text x="304" y="316" fill="#073a40" font-family="Manrope, Segoe UI, sans-serif" font-size="10.5" font-weight="700">Pick a type scale</text>
    <text x="304" y="330" fill="#7b9692" font-family="Manrope, Segoe UI, sans-serif" font-size="7">Serif for voice, sans for tools.</text>
    <g fill="#073a40" font-family="Georgia, serif">
      <text x="304" y="352" font-size="13">Aa</text>
    </g>
    <text x="326" y="352" fill="#18b59a" font-family="Manrope, Segoe UI, sans-serif" font-size="11" font-weight="800">Aa</text>
    <text x="346" y="351" fill="#7b9692" font-family="Manrope, Segoe UI, sans-serif" font-size="6.5">Manrope / Instrument</text>
  </g>

  <g filter="url(#mosaicSoft)">
    <rect x="540" y="156" width="150" height="118" rx="4" fill="#18b59a" transform="rotate(-2 615 215)"/>
    <text x="558" y="184" fill="#05343a" font-family="Manrope, Segoe UI, sans-serif" font-size="8" font-weight="800" letter-spacing=".5">MAYBE</text>
    <text x="558" y="204" fill="#05343a" font-family="Manrope, Segoe UI, sans-serif" font-size="10" font-weight="700">A weekly “show</text>
    <text x="558" y="217" fill="#05343a" font-family="Manrope, Segoe UI, sans-serif" font-size="10" font-weight="700">and tell” slot?</text>
    <text x="558" y="240" fill="#0a5d51" font-family="Manrope, Segoe UI, sans-serif" font-size="7">Friday, 20 min, no slides.</text>
  </g>

  <g filter="url(#mosaicSoft)">
    <rect x="706" y="200" width="54" height="84" rx="4" fill="#f2ede4" transform="rotate(4 733 242)"/>
    <path d="M720 226h26M720 236h20M720 246h23" stroke="#b9ad9b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="733" cy="266" r="7" fill="#18b59a"/>
  </g>

  <g filter="url(#mosaicSoft)">
    <rect x="540" y="300" width="216" height="92" rx="10" fill="#ffffff"/>
    <text x="554" y="322" fill="#073a40" font-family="Manrope, Segoe UI, sans-serif" font-size="10.5" font-weight="700">Name the ritual</text>
    <text x="554" y="336" fill="#7b9692" font-family="Manrope, Segoe UI, sans-serif" font-size="7">“Friday finish” feels honest.</text>
    <g font-family="Manrope, Segoe UI, sans-serif" font-size="6" font-weight="700">
      <rect x="554" y="346" width="44" height="14" rx="7" fill="#eaf7f4"/>
      <text x="576" y="355.5" text-anchor="middle" fill="#0a7969">Naming</text>
      <rect x="604" y="346" width="36" height="14" rx="7" fill="#eaf7f4"/>
      <text x="622" y="355.5" text-anchor="middle" fill="#0a7969">Copy</text>
    </g>
    <circle cx="560" cy="378" r="7" fill="#d7e9e4"/>
    <text x="573" y="381" fill="#7b9692" font-family="Manrope, Segoe UI, sans-serif" font-size="6.5" font-weight="600">Sofia · 2 comments</text>
  </g>

  <g>
    <path d="M472 332l16 38 5-15 16-5z" fill="#073a40" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="490" y="362" width="40" height="18" rx="9" fill="#073a40"/>
    <text x="510" y="374.5" text-anchor="middle" fill="#ffffff" font-family="Manrope, Segoe UI, sans-serif" font-size="7" font-weight="700">Sofia</text>
  </g>

  <g opacity=".8">
    <rect x="584" y="424" width="172" height="40" rx="20" fill="#073a40"/>
    <circle cx="606" cy="444" r="10" fill="#18b59a"/>
    <path d="M602 444h8M606 440v8" stroke="#073a40" stroke-width="1.5" stroke-linecap="round"/>
    <text x="624" y="448" fill="#ffffff" font-family="Manrope, Segoe UI, sans-serif" font-size="8.5" font-weight="700">New note</text>
  </g>
</svg>
