<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Mobile wellness screen with a large breathing ring and routine options">
  <defs>
    <linearGradient id="tidesBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1fbf8"/>
      <stop offset="1" stop-color="#d7efe8"/>
    </linearGradient>
    <linearGradient id="tidesPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b4c53"/>
      <stop offset="1" stop-color="#073a40"/>
    </linearGradient>
    <linearGradient id="tidesScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fdfb"/>
      <stop offset="1" stop-color="#eaf7f4"/>
    </linearGradient>
    <linearGradient id="tidesRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18b59a"/>
      <stop offset="1" stop-color="#0a7969"/>
    </linearGradient>
    <radialGradient id="tidesOrb" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#17a992"/>
      <stop offset="1" stop-color="#073a40"/>
    </radialGradient>
    <filter id="tidesShadow" x="-40%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#0a4a47" flood-opacity=".26"/>
    </filter>
    <filter id="tidesSoft" x="-40%" y="-30%" width="180%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a4a47" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#tidesBg)"/>
  <circle cx="126" cy="256" r="118" fill="none" stroke="#18b59a" stroke-opacity=".14" stroke-width="1.5"/>
  <circle cx="126" cy="256" r="168" fill="none" stroke="#18b59a" stroke-opacity=".09" stroke-width="1.5"/>
  <circle cx="684" cy="250" r="118" fill="none" stroke="#18b59a" stroke-opacity=".14" stroke-width="1.5"/>
  <circle cx="684" cy="250" r="168" fill="none" stroke="#18b59a" stroke-opacity=".09" stroke-width="1.5"/>
  <circle cx="654" cy="72" r="90" fill="#18b59a" fill-opacity=".06"/>
  <circle cx="98" cy="424" r="82" fill="#18b59a" fill-opacity=".07"/>

  <g filter="url(#tidesSoft)">
    <rect x="92" y="150" width="152" height="80" rx="14" fill="#ffffff"/>
    <text x="108" y="172" fill="#7b9692" font-family="Manrope, Segoe UI, sans-serif" font-size="7" font-weight="800" letter-spacing="1.2">TODAY</text>
    <text x="108" y="194" fill="#073a40" font-family="Manrope, Segoe UI, sans-serif" font-size="16" font-weight="800">2 of 3</text>
    <text x="108" y="208" fill="#7b9692" font-family="Manrope, Segoe UI, sans-serif" font-size="7">routines complete</text>
    <circle cx="216" cy="180" r="16" fill="none" stroke="#eaf7f4" stroke-width="4"/>
    <circle cx="216" cy="180" r="16" fill="none" stroke="#18b59a" stroke-width="4" stroke-dasharray="67 101" stroke-linecap="round" transform="rotate(-90 216 180)"/>
  </g>

  <g filter="url(#tidesSoft)">
    <rect x="548" y="118" width="164" height="54" rx="27" fill="#ffffff"/>
    <circle cx="574" cy="145" r="14" fill="#eaf7f4"/>
    <path d="M574 137c4 5 5 8 2 11s-8 2-10-2 2-7 8-9Z" fill="#18b59a"/>
    <text x="596" y="142" fill="#073a40" font-family="Manrope, Segoe UI, sans-serif" font-size="8.5" font-weight="700">6 day streak</text>
    <text x="596" y="154" fill="#7b9692" font-family="Manrope, Segoe UI, sans-serif" font-size="6.5">Gentle consistency</text>
  </g>

  <g filter="url(#tidesShadow)">
    <rect x="300" y="50" width="200" height="400" rx="34" fill="url(#tidesPhone)"/>
    <rect x="310" y="60" width="180" height="380" rx="26" fill="url(#tidesScreen)"/>
    <rect x="372" y="69" width="56" height="9" rx="4.5" fill="#073a40"/>
  </g>

  <g font-family="Manrope, Segoe UI, sans-serif">
    <text x="328" y="92" fill="#073a40" font-size="6.5" font-weight="800">9:41</text>
    <g fill="#073a40" opacity=".5">
      <rect x="448" y="87" width="2.5" height="4" rx="1"/>
      <rect x="453" y="85" width="2.5" height="6" rx="1"/>
      <rect x="458" y="83" width="2.5" height="8" rx="1"/>
      <rect x="464" y="85" width="9" height="6" rx="1.5"/>
    </g>
    <text x="328" y="113" fill="#7b9692" font-size="6.5" font-weight="600">Good evening, Lucas</text>
    <text x="328" y="132" fill="#073a40" font-size="14" font-weight="800" letter-spacing="-.2">Take a moment.</text>
  </g>

  <circle cx="400" cy="238" r="76" fill="none" stroke="#18b59a" stroke-opacity=".13" stroke-width="1.5"/>
  <circle cx="400" cy="238" r="62" fill="none" stroke="#18b59a" stroke-opacity=".2" stroke-width="1.5" stroke-dasharray="4 7"/>
  <circle cx="400" cy="238" r="48" fill="none" stroke="#cdeee7" stroke-width="8"/>
  <circle cx="400" cy="238" r="48" fill="none" stroke="url(#tidesRing)" stroke-width="8" stroke-dasharray="246 302" stroke-linecap="round" transform="rotate(-90 400 238)"/>
  <circle cx="400" cy="238" r="35" fill="url(#tidesOrb)"/>
  <text x="400" y="234" text-anchor="middle" fill="#ffffff" font-family="Manrope, Segoe UI, sans-serif" font-size="9" font-weight="700">Breathe in</text>
  <text x="400" y="248" text-anchor="middle" fill="#a8e7db" font-family="Manrope, Segoe UI, sans-serif" font-size="7" font-weight="600">4 · 7 · 8</text>

  <text x="400" y="316" text-anchor="middle" fill="#073a40" font-family="Georgia, 'Times New Roman', serif" font-size="17">A three-minute reset.</text>
  <text x="400" y="331" text-anchor="middle" fill="#7b9692" font-family="Manrope, Segoe UI, sans-serif" font-size="7" font-weight="600">Box breathing · no rush</text>

  <g font-family="Manrope, Segoe UI, sans-serif" font-size="7" font-weight="700">
    <rect x="330" y="348" width="64" height="24" rx="12" fill="#18b59a"/>
    <text x="362" y="363" text-anchor="middle" fill="#05343a">Morning</text>
    <rect x="402" y="348" width="68" height="24" rx="12" fill="#ffffff" stroke="#cfe7e1"/>
    <text x="436" y="363" text-anchor="middle" fill="#4e6a6b">Evening</text>
  </g>

  <g font-family="Manrope, Segoe UI, sans-serif">
    <rect x="328" y="384" width="144" height="34" rx="17" fill="#073a40"/>
    <text x="400" y="405" text-anchor="middle" fill="#ffffff" font-size="8" font-weight="700">Start breathing</text>
    <circle cx="362" cy="432" r="2.5" fill="#c9ddd8"/>
    <circle cx="400" cy="432" r="2.5" fill="#18b59a"/>
    <circle cx="438" cy="432" r="2.5" fill="#c9ddd8"/>
  </g>

  <path d="M680 330c-18 8-26 22-22 38s20 26 40 22" fill="none" stroke="#18b59a" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M684 348c-10 5-14 13-12 22s12 14 22 12" fill="none" stroke="#18b59a" stroke-opacity=".25" stroke-width="1.5" stroke-linecap="round"/>
</svg>
