    <path d="M96 0c8 92 36 140 26 218s-32 140 12 282" stroke-width="7" stroke-opacity=".85"/>
    <path d="M420 0c-18 90 10 152 2 226s-44 124-24 274" stroke-width="6" stroke-opacity=".8"/>
    <path d="M0 120c90 20 164 4 244 18s134 32 174 12" stroke-width="4" stroke-opacity=".65"/>
    <path d="M40 330c88 16 156-24 238-18s150 38 216 20" stroke-width="4" stroke-opacity=".6"/>
  </g>

  <g fill="#ffffff" opacity=".5">
