    <rect x="216" y="188" width="46" height="30" rx="5" transform="rotate(-8 239 203)"/>
    <rect x="470" y="330" width="56" height="36" rx="5" transform="rotate(7 498 348)"/>
    <rect x="482" y="376" width="44" height="28" rx="5" transform="rotate(7 504 390)"/>
    <rect x="330" y="270" width="50" height="34" rx="5" transform="rotate(-4 355 287)"/>
  </g>

  <path d="M156 354C214 330 246 322 298 304s82-44 114-62 84-30 116-24 70 24 96 8" fill="none" stroke="#073a40" stroke-width="3.4" stroke-dasharray="2 11" stroke-linecap="round"/>

  <g filter="url(#northPin)">
    <circle cx="156" cy="354" r="15" fill="#ffffff"/>
    <circle cx="156" cy="354" r="8" fill="#18b59a"/>
    <circle cx="298" cy="304" r="15" fill="#ffffff"/>
    <circle cx="298" cy="304" r="8" fill="#18b59a"/>
    <path d="M624 226c0 20-22 38-22 38s-22-18-22-38a22 22 0 1 1 44 0Z" fill="#073a40"/>
    <circle cx="602" cy="226" r="8" fill="#8df0dd"/>
    <path d="M412 242c0 17-19 32-19 32s-19-15-19-32a19 19 0 1 1 38 0Z" fill="#18b59a"/>
    <circle cx="393" cy="242" r="6.5" fill="#ffffff"/>
