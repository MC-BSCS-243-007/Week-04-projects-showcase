  <g filter="url(#northShadow)">
    <circle cx="714" cy="68" r="24" fill="#ffffff"/>
    <path d="M714 50l7 15-7 21-7-21z" fill="#18b59a"/>
    <path d="M714 86l-7-21h14z" fill="#073a40" opacity=".18"/>
    <circle cx="714" cy="68" r="3" fill="#ffffff"/>
  </g>

  <g filter="url(#northShadow)">
    <rect x="48" y="118" width="83" height="30" rx="15" fill="#ffffff"/>
    <circle cx="65" cy="133" r="3.5" fill="#18b59a"/>
    <text x="75" y="137" fill="#073a40" font-family="Manrope, Segoe UI, sans-serif" font-size="9" font-weight="700">3 days</text>
    <rect x="140" y="118" width="108" height="30" rx="15" fill="#ffffff"/>
    <text x="194" y="137" text-anchor="middle" fill="#073a40" font-family="Manrope, Segoe UI, sans-serif" font-size="9" font-weight="700">Coastal route</text>
  </g>

  <g filter="url(#northShadow)">
    <rect x="418" y="326" width="334" height="126" rx="16" fill="#ffffff"/>
    <text x="440" y="356" fill="#073a40" font-family="Georgia, 'Times New Roman', serif" font-size="23">Northline</text>
    <text x="440" y="372" fill="#7b9692" font-family="Manrope, Segoe UI, sans-serif" font-size="8.5" font-weight="600">A slower route through the north · 7 stops</text>
    <g font-family="Manrope, Segoe UI, sans-serif" font-size="8.5" font-weight="600" fill="#4e6a6b">
      <circle cx="446" cy="393" r="3.5" fill="#18b59a"/>
      <text x="458" y="396">Bergen — harbour walk</text>
      <text x="644" y="396" fill="#0a7969" font-weight="700">Day 1</text>
      <circle cx="446" cy="413" r="3.5" fill="#18b59a"/>
      <text x="458" y="416">Flåm — rail &amp; fjord</text>
      <text x="644" y="416" fill="#0a7969" font-weight="700">Day 2</text>
      <circle cx="446" cy="433" r="3.5" fill="#18b59a"/>
      <text x="458" y="436">Aurland — lookout</text>
      <text x="644" y="436" fill="#0a7969" font-weight="700">Day 3</text>
    </g>
    <line x1="446" y1="400" x2="446" y2="426" stroke="#cae7df" stroke-width="1.4"/>
    <circle cx="720" cy="350" r="12" fill="#eaf7f4"/>
    <path d="M716 350h8M721 346l4 4-4 4" fill="none" stroke="#0a7969" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
