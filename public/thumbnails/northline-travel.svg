<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Travel planning map with a dotted route, destination pins and an itinerary card">
  <defs>
    <linearGradient id="northBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef9f6"/>
      <stop offset="1" stop-color="#dcefe9"/>
    </linearGradient>
    <linearGradient id="northWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe7df"/>
      <stop offset="1" stop-color="#a9ddd3"/>
    </linearGradient>
    <filter id="northShadow" x="-30%" y="-30%" width="170%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a4a47" flood-opacity=".18"/>
    </filter>
    <filter id="northPin" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#073a40" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#northBg)"/>

  <path d="M600 0h200v500H560c34-58 56-112 52-168-5-72-40-124-70-176-22-38-32-84 58-156Z" fill="url(#northWater)"/>
  <path d="M622 0c-80 70-66 112-42 150 30 50 62 100 66 170 4 56-18 112-50 180" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity=".7"/>

  <g fill="#d6ece3" opacity=".9">
    <path d="M70 150c38-26 86-22 112 6s18 66-16 82-82 10-104-18-26-52 8-70Z"/>
    <path d="M310 60c30-18 68-10 82 16s2 54-28 64-68-2-80-24 0-42 26-56Z"/>
    <path d="M356 380c44-20 96-6 112 28s-14 68-58 74-92-16-102-48 12-42 48-54Z"/>
    <path d="M120 400c26-14 60-8 72 14s-6 46-34 52-64-6-70-28 8-26 32-38Z"/>
