  <g filter="url(#northShadow)">
    <rect x="48" y="40" width="524" height="56" rx="28" fill="#ffffff"/>
    <circle cx="80" cy="68" r="15" fill="#eaf7f4"/>
    <circle cx="77" cy="65" r="5" fill="none" stroke="#0a7969" stroke-width="2"/>
    <path d="M81 69l4 4" stroke="#0a7969" stroke-width="2" stroke-linecap="round"/>
    <text x="106" y="73" fill="#6b8580" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="600">Where to next?</text>
    <line x1="386" y1="56" x2="386" y2="80" stroke="#e3efeb"/>
    <text x="402" y="73" fill="#073a40" font-family="Manrope, Segoe UI, sans-serif" font-size="10" font-weight="700">3 days</text>
    <circle cx="534" cy="68" r="18" fill="#073a40"/>
    <text x="534" y="72" text-anchor="middle" fill="#ffffff" font-family="Manrope, Segoe UI, sans-serif" font-size="9" font-weight="800">AR</text>
