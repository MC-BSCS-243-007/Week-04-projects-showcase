      <text x="698" y="375" text-anchor="end" fill="#0a7969" font-size="8" font-weight="800">+$1,450</text>
      <line x1="354" y1="390" x2="706" y2="390" stroke="#eff6f4"/>

      <circle cx="364" cy="406" r="10" fill="#eaf7f4"/>
      <path d="M360 406h8M364 410v-8" stroke="#0a7969" stroke-width="1.3" stroke-linecap="round"/>
      <text x="382" y="404" fill="#073a40" font-size="8" font-weight="700">Market run</text>
      <text x="382" y="414" fill="#7b9692" font-size="6.5">Oct 19 · Food</text>
      <text x="698" y="409" text-anchor="end" fill="#073a40" font-size="8" font-weight="800">−$86</text>
