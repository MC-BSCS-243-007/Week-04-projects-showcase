      <text x="698" y="341" text-anchor="end" fill="#073a40" font-size="8" font-weight="800">−$980</text>
      <line x1="354" y1="356" x2="706" y2="356" stroke="#eff6f4"/>

      <circle cx="364" cy="372" r="10" fill="#eaf7f4"/>
